name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Baixar fontes (Google Fonts)
        run: |
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/google/fonts/main/ofl"
          curl -fsSL -o app/src/main/res/font/archivo.ttf "$base/archivo/Archivo%5Bwdth,wght%5D.ttf"
          curl -fsSL -o app/src/main/res/font/manrope.ttf "$base/manrope/Manrope%5Bwght%5D.ttf"
          curl -fsSL -o app/src/main/res/font/chakra_petch.ttf "$base/chakrapetch/ChakraPetch-SemiBold.ttf"
          ls -la app/src/main/res/font

      - name: Preparar chave de assinatura
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/launcher.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/launcher.jks" >> "$GITHUB_ENV"

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Launcher-Mae-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-Mae-v1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Launcher da mãe v1.0.${{ github.run_number }}
          files: out/*.apk
